name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/notes.exe dist/
          windeployqt --release --no-translations dist/notes.exe

      - name: Copy VC runtime
        run: Copy-Item C:\Windows\System32\vcruntime140*.dll, C:\Windows\System32\msvcp140*.dll dist/
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-windows-x64
          path: dist/
          if-no-files-found: error
